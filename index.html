const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

const T=iso(new Date());
const FOODS0=()=>[{id:'f1',n:'chipotle chicken bowl',k:850,p:45},{id:'f2',n:'protein shake',k:430,p:32},{id:'f3',n:'yogurt bowl',k:530,p:15},{id:'f4',n:'granola bar',k:200,p:5},{id:'f5',n:'banana',k:105,p:1},{id:'f6',n:'falafel wrap',k:650,p:20},{id:'f7',n:'chips, small bag',k:200,p:2},{id:'f8',n:'cookie',k:250,p:3}];
const food0=()=>({foods:FOODS0(),log:[],tk:2500,tp:125});
function seed(){return{logs:[],weights:[],abs:[],ex:{},food:food0()}}
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&Array.isArray(o.logs)&&Array.isArray(o.weights)){o.abs=o.abs||[];o.ex=o.ex||{};o.food=o.food||food0();return o}}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),tab="log",sel=T,confirmReset=false,liftSel="Leg press";
let P=[],DB=null,viewing=null,confirmPhoto=null;
let unit='kg';try{unit=localStorage.getItem('wb:unit')==='lb'?'lb':'kg'}catch(e){}
const toU=k=>unit==='lb'?k*2.20462:k,fromU=v=>unit==='lb'?v/2.20462:v,fw=k=>+toU(k).toFixed(unit==='lb'?1:2);
const idb=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('gymlog-photos',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
const st=m=>DB.transaction('p',m).objectStore('p');
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function initPhotos(){try{DB=await idb();const all=await req(st('readonly').getAll());P=[];for(const p of all){if(p.data)P.push({...p,url:p.data});else await req(st('readwrite').delete(p.id))}}catch(e){DB=null}render()}
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.75))};im.onerror=()=>rej();im.src=u})}
async function addPhoto(f){if(!f)return;if(!DB){toast('this browser cannot save photos');return}
try{const data=await shrink(f),el=$('#pdate'),date=(el&&el.value)||sel,a=$('#angle'),p={id:uid(),date,angle:a?a.value:'front',data};await req(st('readwrite').put(p));P.push({...p,url:data});sel=date;toast('photo saved to '+fmt(date))}catch(e){toast('could not save that photo')}render()}
async function delPhoto(id){const p=P.find(x=>x.id===id);try{await req(st('readwrite').delete(id))}catch(e){}if(p)URL.revokeObjectURL(p.url);P=P.filter(x=>x.id!==id)}
const photoGrid=l=>l.length?`<div class='ph-grid'>`+l.map(p=>`<button data-photo='${p.id}' aria-label='open photo'><img src='${p.url}' alt=''><span>${fmt(p.date)} ${esc(p.angle)}</span></button>`).join('')+'</div>':'';
function showViewer(){const v=$('#viewer'),p=viewing&&P.find(x=>x.id===viewing);if(!p){v.hidden=true;v.innerHTML='';return}
const ins=p.kind==='inspo';
v.hidden=false;v.innerHTML=`<img src='${p.url}' alt='${ins?'inspiration':'progress photo'}'><p class='hint'>${ins?esc(p.caption||'inspiration'):fmt(p.date)+', '+esc(p.angle)}</p>${ins?'':`<div class='bar'><input type='date' id='vdate' value='${p.date}'><button class='btn ghost' data-a='savedate'>save date</button></div>`}<div class='bar'><button class='btn' data-a='closev'>close</button><button class='btn ghost' data-a='delphoto'>${confirmPhoto===viewing?'tap again to delete':'delete'}</button></div>`}
let pt;function prFx(ex,w,r){const f=$('#prfx');f.innerHTML=`<div class='prbox'><i class='halo'></i><b>new pr</b><span>${esc(ex)}</span><em>${w} x ${r}</em></div>`;f.classList.remove('go');void f.offsetWidth;f.classList.add('go');clearTimeout(pt);pt=setTimeout(()=>f.classList.remove('go'),2700)}
async function addInspo(fs){if(!fs.length)return;if(!DB){toast('this browser cannot save pictures');return}
const cap=(($('#icap')||{}).value||'').trim();let n=0;
for(const f of fs){try{const data=await shrink(f),p={id:uid(),date:T,kind:'inspo',caption:cap,data};await req(st('readwrite').put(p));P.push({...p,url:data});n++}catch(e){}}
toast(n?'saved '+n+' picture'+(n>1?'s':''):'could not save');render()}
function vInsp(){const L=P.filter(p=>p.kind==='inspo').sort((a,b)=>a.date<b.date?1:-1);
return `<h2>gym inspiration</h2><p class='hint'>save pictures that motivate you: a physique goal, lift form, a gym you want to train in, a quote. they stay on this device. tap one to view it full-screen.</p><div class='f'><label class='wide'>caption (optional)<input id='icap' placeholder='e.g. back day goal' autocomplete='off'></label></div><label class='btn pick'>add pictures<input type='file' accept='image/*' multiple id='ipic' class='vh'></label>`+(L.length?`<div class='inspo'>`+L.map(p=>`<button data-photo='${p.id}' aria-label='open picture'><img src='${p.url}' alt=''>${p.caption?`<span>${esc(p.caption)}</span>`:''}</button>`).join('')+'</div>':`<p class='hint'>nothing here yet.</p>`)}
const now=new Date(),cal={y:now.getFullYear(),m:now.getMonth()};
let tt;function toast(m){$("#tmsg").textContent=m;$("#toast").classList.add("show");clearTimeout(tt);tt=setTimeout(()=>$("#toast").classList.remove("show"),2600)}

function prs(){const m={};const B=S.base||{};for(const n in B)m[n]={w:B[n][0],r:B[n][1],d:null};
for(const l of S.logs){const p=m[l.ex];if(!p||l.w>p.w||(l.w===p.w&&l.r>p.r))m[l.ex]={w:l.w,r:l.r,d:l.date}}return m}
function last(ex){const ls=S.logs.filter(l=>l.ex===ex).sort((a,b)=>a.date<b.date?1:-1);if(!ls.length)return null;const d=ls[0].date;return ls.filter(l=>l.date===d).reduce((a,b)=>b.w>a.w||(b.w===a.w&&b.r>a.r)?b:a)}
function hint(ex){if(!ex)return"";const l=last(ex),p=prs()[ex];let h="";
if(l){const[lo,hi]=RANGE[ex]||[8,12];h=`Last: ${l.w} x ${l.r} x ${l.s} (${fmt(l.date)}). `+(l.r>=hi?`Top of the range hit, so add weight and restart near ${lo} reps.`:`Next: stay at ${l.w} and aim for ${l.r+1} reps.`)}
else h="New exercise: pick a weight you can do for 8-12 reps with 1-2 left in the tank.";
if(p)h+=` PR: ${p.w} x ${p.r}.`;return h}

function stats(){const ds=new Set([...S.logs,...S.abs].map(l=>l.date));const ym=T.slice(0,7);const mo=[...ds].filter(d=>d.startsWith(ym)).length;
const w=new Date();w.setDate(w.getDate()-6);const a=iso(w);const wk=[...ds].filter(d=>d>=a&&d<=T).length;
const ws=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);const kg=ws.length?fw(ws[ws.length-1].kg):"-";
return `<div><b>${mo}</b><span>gym days this month</span></div><div><b>${wk}</b><span>last 7 days</span></div><div><b>${kg}</b><span>${unit} now</span></div><div><b>${ds.size}</b><span>days logged</span></div>`}

function dayList(){const day=S.logs.filter(l=>l.date===sel);
return `<h2>${fmt(sel)}</h2>`+(day.length?`<ul class="list">`+day.map(l=>`<li><span>${esc(l.ex)}: ${l.w} x ${l.r} x ${l.s}</span><em class='mgx'>${mgOf(l.ex)}</em><button data-del="${l.id}" aria-label="Delete">×</button></li>`).join("")+"</ul>":`<p class="hint">Nothing logged for this day.</p>`)+abList()+photoGrid(P.filter(p=>p.date===sel&&!p.kind))}

function vLog(){const names=[...new Set([...allEx().map(e=>e.n),...S.logs.map(l=>l.ex)])].sort();
return `<h2>Log a lift</h2><div id='expk'>${pickHTML()}</div><div class="f"><label class="wide">Date<input type="date" id="date" value="${sel}"></label>
<label class="wide">Exercise<input id="ex" list="exl" placeholder="Start typing, e.g. Leg press" autocomplete="off"></label>
<label>Weight<input id="w" type="number" step="0.5" inputmode="decimal"></label><label>Reps<input id="r" type="number" inputmode="numeric"></label><label>Sets<input id="s" type="number" value="3" inputmode="numeric"></label></div>
<datalist id="exl">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
<p class="hint" id="hint"></p><div id='xnew'></div><button class="btn" data-a="addlog">Add lift</button>
${dayList()}
<h2>Log an ab circuit</h2><p class='hint'>1 min on, 30 sec rest. tap moves to build up to 8, in order. my usual and suggest fresh open the timer, where fresh lets you pick a difficulty and length.</p><div class='abpick'>${AB.map(a=>`<button class='ab${abSel.includes(a.n)?' on':''}' data-ab='${a.n}'>${a.n}</button>`).join('')}</div><p class='hint'>circuit (${abSel.length}/8): ${abSel.length?abSel.join(', '):'none yet'}</p><button class='btn' data-a='logab'>Log circuit</button><button class='btn ghost' data-a='abusual'>My usual</button><button class='btn ghost' data-a='absug'>Suggest fresh</button><button class='btn ghost' data-a='abstart'>Start timer</button><button class='btn ghost' data-a='abclr'>Clear</button>
<h2>Log a weigh-in</h2><div class="f"><label>Date<input type="date" id="wdate" value="${sel}"></label><label>Weight (${unit})<input id="kg" type="number" step="0.05" inputmode="decimal"></label></div><button class="btn" data-a="addw">Save weigh-in</button>
<h2>log a progress pic</h2><p class='hint'>saves to the date below, so pick an earlier date to add an older picture. it shows on the calendar. photos stay on this device.</p><div class='f'><label class='wide'>date of photo<input type='date' id='pdate' value='${sel}'></label><label class='wide'>angle<select id='angle'><option>front</option><option>side</option><option>back</option><option>other</option></select></label></div><label class='btn pick'>take or choose photo<input type='file' accept='image/*' id='pic' class='vh'></label>`}

function vCal(){const{y,m}=cal;const first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),days=new Set([...S.logs,...S.abs].map(l=>l.date)),pd=new Set(P.filter(p=>!p.kind).map(p=>p.date));
let h=`<div class="calhead"><button data-a="prev" aria-label="Previous month">‹</button><b>${first.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</b><button data-a="next" aria-label="Next month">›</button></div><div class="cal">`+["M","T","W","T","F","S","S"].map(x=>`<i class="dow">${x}</i>`).join("");
for(let i=0;i<off;i++)h+="<i></i>";
for(let d=1;d<=n;d++){const s=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;h+=`<button class="d${days.has(s)?" on":""}${s===T?" today":""}${s===sel?" sel":""}${pd.has(s)?" ph":""}" data-day="${s}">${d}</button>`}
return h+`</div><p class="hint">Blue days have a logged session; an orange dot means a progress photo. Tap a day to see it, then use the Log tab to add lifts to that date.</p>`+dayList()}

function chart(series,x0,x1,y0,y1){const W=600,H=230,L=48,R=10,Tp=10,B=24;
const X=t=>L+(t-x0)/((x1-x0)||1)*(W-L-R),Y=v=>H-B-(v-y0)/((y1-y0)||1)*(H-Tp-B);let g="";
for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="tx">${+v.toFixed(1)}</text>`}
g+=`<text x="${L}" y="${H-6}" class="tx">${fmt(iso(new Date(x0)))}</text>`;
let c=new Date(x0);c=new Date(c.getFullYear(),c.getMonth()+1,1);
while(c.getTime()<x1){if(X(c.getTime())-L>48)g+=`<text x="${X(c.getTime())}" y="${H-6}" class="tx" text-anchor="middle">${c.toLocaleDateString("en-US",{month:"short"}).toLowerCase()}</text>`;c=new Date(c.getFullYear(),c.getMonth()+1,1)}
for(const s of series){g+=`<path d="${s.pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ")}" class="${s.c}"/>`;if(s.dots)s.pts.forEach(p=>g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4.5" class="dt"/>`)}
return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Chart">${g}</svg>`}

function wChart(){const ws=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);if(!ws.length)return`<p class="hint">Add a weigh-in to see the chart.</p>`;
const D=864e5,t0=dt(ws[0].date).getTime(),k0=toU(ws[0].kg),lt=dt(ws[ws.length-1].date).getTime();let x1=t0+183*D;if(lt>x1)x1=lt;
const mo=(x1-t0)/D/30.4,hi=k0+toU(0.6)*mo,lo=k0+toU(0.25)*mo,all=[...ws.map(w=>toU(w.kg)),lo,hi];
return chart([{pts:[[t0,k0],[x1,hi]],c:"pj"},{pts:[[t0,k0],[x1,lo]],c:"pj"},{pts:ws.map(w=>[dt(w.date).getTime(),toU(w.kg)]),c:"ln",dots:1}],t0,x1,Math.floor(Math.min(...all)-1),Math.ceil(Math.max(...all)+1))}

function lChart(){const m={};S.logs.filter(l=>l.ex===liftSel).forEach(l=>{m[l.date]=Math.max(m[l.date]||0,l.w)});const k=Object.keys(m).sort();
if(k.length<2)return`<p class="hint">Log this lift on two different days to see a trend.</p>`;
const pts=k.map(d=>[dt(d).getTime(),m[d]]),v=pts.map(p=>p[1]);
return chart([{pts,c:"ln",dots:1}],pts[0][0],pts[pts.length-1][0],Math.floor(Math.min(...v)-2),Math.ceil(Math.max(...v)+2))}

function vProg(){const p=prs(),cols=["var(--red)","var(--blue)","var(--yellow)","var(--green)","var(--white)"];
const ws=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);const chg=ws.length>1?(ws[ws.length-1].kg-ws[0].kg):0;
const bars=Object.keys(TG()).map((n,i)=>{const b=p[n]?p[n].w:0;return`<div class="lift"><div class="row"><span>${n}</span><em>${b} of ${TG()[n]}</em></div><div class="track"><div class="now" style="width:${Math.min(100,b/TG()[n]*100)}%;background:${cols[i]}"></div></div></div>`}).join("");
const names=[...new Set(S.logs.map(l=>l.ex))].sort();
return `<h2>Bodyweight</h2><p class="hint">${ws.length>1?`Change since first weigh-in: ${chg>=0?"+":""}${toU(chg).toFixed(2)} ${unit}. `:""}Dots are your weigh-ins. Dashed lines are the projected range of ${unit==="lb"?"0.55 to 1.3 lb":"0.25 to 0.6 kg"} a month.</p>${wChart()}
<ul class="list">${[...ws].reverse().slice(0,6).map(w=>`<li><span>${fmt(w.date)}: ${fw(w.kg)} ${unit}</span><button data-delw="${w.id}" aria-label="Delete">×</button></li>`).join("")}</ul>
<h2>Progress to week 24 targets</h2>${bars}
<h2>Lift trend</h2><label>Exercise<select id="lsel">${["push","pull","arms","legs","core","other"].map(g=>{const o=names.filter(n=>((findEx(n)||{}).t||"other")===g);return o.length?`<optgroup label="${g}">${o.map(n=>`<option${n===liftSel?" selected":""}>${esc(n)}</option>`).join("")}</optgroup>`:""}).join("")}</select></label>${lChart()}<h2>progress pics</h2>${P.some(p=>!p.kind)?photoGrid(P.filter(p=>!p.kind).sort((a,b)=>a.date<b.date?1:-1)):`<p class='hint'>no photos yet. add one from the log tab.</p>`}${vRep()}`}

function vPr(){const p=prs(),d1=new Date(),d2=new Date();d1.setDate(d1.getDate()-6);d2.setDate(d2.getDate()-30);const w=iso(d1),m=iso(d2);
const ks=Object.keys(p).sort(),nWk=ks.filter(n=>p[n].d&&p[n].d>=w).length;
return `<h2>Personal records</h2><p class="hint">Heaviest weight per lift, with the most reps at that weight. Updates itself when you log.${nWk?" "+nWk+" new this week.":""}</p><div class="prs" style="margin-top:12px">`+
ks.map(n=>{const r=p[n],wk=r.d&&r.d>=w,mo=!wk&&r.d&&r.d>=m;return`<div class="pr${wk?" wk":mo?" new":""}"><span>${esc(n)}</span><b>${r.w} x ${r.r}</b><i>${r.d?fmt(r.d):"earlier"}, ${mgOf(n)}</i>${wk?"<em class='wk'>new this week</em>":mo?"<em>new this month</em>":""}</div>`}).join("")+"</div>"}

function vData(){return `<h2>Backup</h2><p class="hint">Your data is saved in this browser only. Copy this text somewhere safe, or paste a backup here to restore it on another device. Progress photos are stored separately on this device and are not included.</p><textarea id="bk">${esc(JSON.stringify(S))}</textarea><button class="btn" data-a="load">Load pasted backup</button><button class="btn ghost" data-a="reset">${confirmReset?"Tap again to erase everything":"Erase all data"}</button>`}

function render(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("act",b.dataset.tab===tab);if(b.dataset.tab==="insp")b.classList.toggle("hid",tab!=="insp")});
$("#stats").innerHTML=stats();$("#view").innerHTML=({log:vLog,cal:vCal,prog:vProg,pr:vPr,food:vFood,insp:vInsp,data:vData})[tab]();showViewer()}

function addLog(){let ex=$("#ex").value.trim(),w=parseFloat($("#w").value),r=parseInt($("#r").value),s=parseInt($("#s").value)||3,date=$("#date").value||sel;
if(!ex||isNaN(w)||isNaN(r)){toast("Add an exercise, weight and reps");return}
const fx=findEx(ex);if(fx)ex=fx.n;else{const mgv=($("#xmg")||{}).value;if(!mgv){toast("Pick a muscle group for this new exercise");return}S.ex[ex]={mg:mgv,t:TAG[mgv]}}
const b=prs()[ex];S.logs.push({id:uid(),date,ex,w,r,s});save();sel=date;const p=prs()[ex];
if(p.d===date&&p.w===w&&p.r===r&&(!b||b.w!==w||b.r!==r))prFx(ex,w,r);else toast("Logged")}
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const AB=[{n:'crunch',c:'flex',d:1,m:1},{n:'reverse crunch',c:'flex',d:2,h:1,hf:1},{n:'sit-up',c:'flex',d:2,hf:1},{n:'weighted crunch',c:'flex',d:2},{n:'v-up',c:'flex',d:3,h:1,hf:1},
{n:'plank',c:'anti',d:1},{n:'dead bug',c:'anti',d:1},{n:'bird dog',c:'anti',d:1,m:1},{n:'plank shoulder taps',c:'anti',d:2},{n:'hollow hold',c:'anti',d:3},{n:'body saw',c:'anti',d:3},{n:'long-lever plank',c:'anti',d:3},
{n:'side plank',c:'lat',d:2,m:1,two:1},{n:'ankle touches',c:'lat',d:1},{n:'side plank hip dips',c:'lat',d:3,two:1},
{n:'bicycle crunch',c:'rot',d:2},{n:'russian twist',c:'rot',d:2},{n:'windshield wipers',c:'rot',d:3},
{n:'leg raise',c:'leg',d:2,h:1,hf:1},{n:'flutter kicks',c:'leg',d:1,hf:1}];
let abSel=S.abs.length?[...S.abs[S.abs.length-1].ex]:[],repText='';
function abList(){const a=S.abs.filter(c=>c.date===sel);return a.length?`<ul class='list'>`+a.map(c=>`<li><span>ab circuit: ${c.ex.map(esc).join(', ')}</span><button data-delab='${c.id}' aria-label='Delete'>×</button></li>`).join('')+'</ul>':''}
const TAG={chest:'push',shoulders:'push','side delts':'push',triceps:'arms',biceps:'arms',back:'pull','rear delts':'pull',traps:'pull',quads:'legs',hamstrings:'legs',glutes:'legs',adductors:'legs',calves:'legs',abs:'core'};

'side delts':['Cable lateral raise','DB lateral raise','Machine lateral raise'],
'rear delts':['Rear delt','Reverse DB fly','Cable rear delt fly','Face pull'],
back:['Lat pulldown','Wide-grip pulldown','Close-grip pulldown','Pull-up','Assisted pull-up','Seated row','Low row','Dual pulley row','Cable row','Chest-supported row','T-bar row','Barbell row','One-arm DB row','Straight-arm pulldown','Back extension','Deadlift'],
traps:['Barbell shrug','DB shrug','Machine shrug'],
biceps:['Bicep machine','Barbell curl','DB curl','Hammer curl','Cable curl','Preacher curl','Incline DB curl'],
triceps:['Tricep pushdown','Rope pushdown','Overhead DB tricep ext','Cable overhead extension','Skull crusher','Close-grip bench press','Tricep dips machine','Tricep kickback'],

hamstrings:['Leg curl','Lying leg curl','Romanian deadlift','Stiff-leg deadlift','Glute-ham raise'],
glutes:['Hip thrust','Hip abduction','Cable kickback','Cable pull-through'],
adductors:['Hip adduction'],calves:['Calf raise','Seated calf raise','Leg press calf raise'],
abs:['Cable crunch','Hanging knee raise','Hanging leg raise','Ab wheel rollout','Decline sit-up']};
const allEx=()=>{const a=[];for(const mg in LIB)LIB[mg].forEach(n=>a.push({n,mg,t:TAG[mg]}));for(const n in (S.ex||{}))a.push({n,mg:S.ex[n].mg,t:S.ex[n].t||TAG[S.ex[n].mg]||'push'});return a};
const findEx=n=>allEx().find(e=>e.n.toLowerCase()===String(n).toLowerCase());
const mgOf=n=>(findEx(n)||{}).mg||'other';

let tm=null,tmInt=null,tmLock=null,abTier='medium',abMin=10;

const CYC={easy:['flex','anti','lat','rot','anti','leg','rot','flex'],medium:['flex','anti','lat','rot','leg','anti','flex','lat','rot','anti'],hard:['flex','anti','lat','rot','leg','anti','flex','lat','anti','rot','leg','anti','flex','lat']};

function abBuild(tier,min){const t=TIERS[tier],segN=Math.max(3,Math.round((min*60+t.R)/(t.W+t.R))),rec={};S.abs.slice(-4).forEach(c=>c.ex.forEach(n=>{rec[n]=(rec[n]||0)+1}));
const out=[];let segs=0,k=0;
while(segs<segN&&k<60){const c=CYC[tier][k%CYC[tier].length];k++;
let cand=AB.filter(a=>a.c===c&&!out.includes(a.n)&&segs+(a.two?2:1)<=segN);if(!cand.length)cand=AB.filter(a=>!out.includes(a.n)&&segs+(a.two?2:1)<=segN);if(!cand.length)break;
const prev=AB.find(a=>a.n===out[out.length-1]),sc=a=>(rec[a.n]||0)*10+Math.abs(a.d-t.d)*3+Math.random()*2-(a.m?3:0)-(a.h&&tier!=='easy'?4:0)+(prev&&prev.hf&&a.hf?25:0);

if(tm.phase==='ready')tmGo('work',tm.W);
else if(tm.phase==='work'){if(last)tmEnd();else tmGo('rest',tm.R)}
else if(tm.phase==='rest'){tm.i++;tmGo('work',tm.W)}}

{n:'vivid black',g:'neon on black',bg:'#000000',ink:'#ffffff',mute:'#8a8a8a',b:'#3dd9ff',o:'#ff4f81',d:1}];
let curTheme='gojo';
function applyTheme(n){n=({sumi:'gojo',ai:'sasuke',matcha:'zoro',shu:'luffy',nasu:'sukuna',washi:'naruto'})[n]||n;const t=THEMES.find(x=>x.n===n)||THEMES[0],s=document.documentElement.style;curTheme=t.n;
s.setProperty('--bg',t.bg);s.setProperty('--ink',t.ink);s.setProperty('--mute',t.mute);s.setProperty('--b',t.b);s.setProperty('--o',t.o);s.setProperty('color-scheme',t.d?'dark':'light');
const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t.bg);
try{localStorage.setItem('wb:theme',t.n)}catch(e){}}
function buildThemes(){$('#thpanel').innerHTML=`<div class='unit'><span>units</span><button data-unit='kg' class='${unit==='kg'?'cur':''}'>kg</button><button data-unit='lb' class='${unit==='lb'?'cur':''}'>lb</button></div>`+THEMES.map(t=>`<button class='th${t.n===curTheme?' cur':''}' data-th='${t.n}'><span class='chips'><i style='background:${t.bg}'></i><i style='background:${t.b}'></i><i style='background:${t.o}'></i></span>${t.n}<em>${t.g}</em></button>`).join('')}
try{applyTheme(localStorage.getItem('wb:theme'))}catch(e){applyTheme('')}
$('#thbtn').addEventListener('click',()=>{const p=$('#thpanel');p.hidden=!p.hidden;$('#thbtn').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)buildThemes()});
$('#thpanel').addEventListener('click',e=>{const u=e.target.closest('[data-unit]');if(u){unit=u.dataset.unit;try{localStorage.setItem('wb:unit',unit)}catch(x){}buildThemes();render();return}const b=e.target.closest('[data-th]');if(!b)return;applyTheme(b.dataset.th);$('#thpanel').hidden=true;$('#thbtn').setAttribute('aria-expanded','false')});
document.addEventListener('click',e=>{if(!e.target.closest('#thpanel,#thbtn')){$('#thpanel').hidden=true;$('#thbtn').setAttribute('aria-expanded','false')}});
let tapN=0,tapT;$('#ttl').addEventListener('click',()=>{tapN++;clearTimeout(tapT);tapT=setTimeout(()=>{tapN=0},900);if(tapN>=3){tapN=0;tab='insp';render()}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();initPhotos();
</script>
