<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Barlow,system-ui,sans-serif}

}
h1{position:relative;border-bottom-color:var(--bd)}
h1::after{content:'';position:absolute;left:0;bottom:-2px;width:64px;height:3px;background:var(--o)}

.stats{border-color:var(--bd)}.stats div{border-color:var(--bd)}
.stats div:nth-child(n+3){border-top-color:var(--bd)}
.tabs{border-bottom-color:var(--bd)}
.tab.act{background:var(--b);color:var(--bg)}
.btn{border-color:var(--o);color:var(--o)}.btn:hover{background:var(--o);color:var(--bg)}
.ghost{border-color:var(--b);color:var(--b)}.ghost:hover{background:var(--b);color:var(--bg)}
.pick{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;cursor:pointer}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline-color:var(--o)}
.d{position:relative}
.d.on{background:var(--b);color:var(--bg)}
.d.sel{outline-color:var(--o)}
.d.ph::after{content:'';position:absolute;right:4px;top:4px;width:6px;height:6px;background:var(--o);border-radius:50%!important}
.gl{stroke:color-mix(in srgb,var(--b) 22%,transparent)}.tx{fill:var(--mute)}
.ln{stroke:var(--b)}.pj{stroke:color-mix(in srgb,var(--o) 75%,transparent)}.dt{stroke:var(--o)}

.pr.new{border-color:var(--o)}.pr em{color:var(--o)}
#toast span{border-color:var(--o)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.ph-grid button{position:relative;padding:0;border:1px solid var(--bd);background:var(--bg);aspect-ratio:3/4;overflow:hidden;cursor:pointer}
.ph-grid img{width:100%;height:100%;object-fit:cover;display:block}
.ph-grid span{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 72%,transparent);color:var(--ink);font-size:11px;padding:3px 5px;text-align:left}
#viewer{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}

#viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
#viewer .hint{margin:0}
#viewer .bar{display:flex;gap:8px;width:100%;max-width:520px}
#viewer .btn{flex:1;margin:0;width:auto}
:root:root:root{--bg:#000;--ink:#fff;--mute:#9a9a9a;--b:#7596b5;--o:#e2823a;--card:var(--bg);--line:color-mix(in srgb,var(--b) 38%,transparent);--bd:color-mix(in srgb,var(--b) 70%,var(--bg));--red:var(--o);--blue:var(--b);--yellow:var(--o);--green:var(--b);--white:var(--ink)}
main{position:relative}
#thbtn{position:absolute;top:32px;right:14px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;gap:2px;background:transparent;border:1px solid var(--bd);cursor:pointer;padding:0}
#thbtn::before{content:'';position:absolute;inset:-8px}
#thbtn i{display:block;width:8px;height:14px}
#thbtn i:first-child{background:var(--b)}#thbtn i:last-child{background:var(--o)}
#thpanel{position:absolute;top:70px;right:14px;z-index:5;width:230px;background:var(--bg);border:1px solid var(--ink);padding:6px}
#thpanel[hidden]{display:none}
.th{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font-size:13px;cursor:pointer;text-align:left;padding:0 6px}
.th:last-child{border-bottom:0}
.th.cur{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.th .chips{display:flex;border:1px solid var(--line)}
.th .chips i{display:block;width:14px;height:20px}
.th em{font-style:normal;color:var(--mute);margin-left:auto;font-size:12px}
@media (max-width:520px){#thbtn{top:24px}#thpanel{top:62px}}
#thpanel{max-height:70vh;overflow-y:auto}
.unit{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid var(--line);font-size:13px}
.unit span{margin-right:auto;color:var(--mute)}
.unit button{min-width:44px;min-height:36px;background:transparent;border:1px solid var(--line);color:var(--ink);cursor:pointer;font-size:13px}
.unit button.cur{background:var(--b);color:var(--bg);border-color:var(--b)}
#viewer .bar input{flex:1;min-width:0}

.inspo button{display:block;width:100%;padding:0;margin:0 0 8px;border:1px solid var(--bd);background:var(--bg);break-inside:avoid;cursor:pointer}
.inspo img{display:block;width:100%;height:auto}
.inspo span{display:block;padding:6px;font-size:12px;text-align:left;color:var(--ink)}
h1{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.tab.hid{display:none}

#prfx{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;background:color-mix(in srgb,var(--bg) 60%,transparent)}
#prfx.go{animation:prfade 2.7s ease both}

.prbox b{display:block;font-size:clamp(44px,13vw,76px);font-weight:700;letter-spacing:.08em;line-height:1;color:var(--ink);text-shadow:0 0 10px var(--o),0 0 26px var(--o),0 0 54px color-mix(in srgb,var(--o) 60%,transparent);animation:prglow 1.1s ease-in-out infinite alternate}
.prbox span{display:block;margin-top:10px;font-size:16px;color:var(--ink)}

</style>

<body>
<main>
<button id='thbtn' aria-label='change color theme' aria-expanded='false'><i></i><i></i></button><div id='thpanel' hidden></div>
<h1>gym log</h1>
<p class="sub">case file: winter bulk, oct 2026 to apr 2027. log lifts and weigh-ins; records, calendar and charts update themselves.</p>
<div class="stats" id="stats"></div>
<nav class="tabs">
<button class="tab" data-tab="log">Log</button><button class="tab" data-tab="cal">Calendar</button><button class="tab" data-tab="prog">Progress</button><button class="tab" data-tab="pr">Records</button><button class="tab hid" data-tab="insp">Inspo</button><button class="tab" data-tab="data">Backup</button>
</nav>
<div id="view"></div>
</main>
<div id="toast"><span id="tmsg"></span></div>
<div id="viewer" hidden></div>
<div id="prfx" aria-live="polite"></div>
<script>
const KEY="wb:v1";
const NAMES=["Barbell curl", "Bicep machine", "Cable chest press", "Cable lateral raise", "Cable shoulder press", "Calf raise", "Converging chest press", "Converging shoulder press", "DB shoulder press", "Hip abduction", "Hip adduction", "Incline DB press", "Lat pulldown", "Leg curl", "Leg extension", "Leg press", "Low row", "Overhead DB tricep ext", "Pec fly", "Rear delt", "Romanian deadlift", "Seated row", "Tricep pushdown"];
const TG=()=>S.targets||{};
const RANGE={"Leg press":[8,10],"Lat pulldown":[8,10],"Converging chest press":[8,10],"Bicep machine":[8,10],"Cable shoulder press":[8,10],"Rear delt":[12,15],"Cable lateral raise":[12,15],"Calf raise":[12,15],"Overhead DB tricep ext":[10,12],"Pec fly":[10,12],"Low row":[10,12],"Seated row":[10,12],"Hip adduction":[10,12],"Cable chest press":[10,12]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dt=s=>new Date(s+"T12:00:00");
const fmt=s=>dt(s).toLocaleDateString("en-US",{month:"short",day:"numeric"}).toLowerCase();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const T=iso(new Date());
function seed(){return{logs:[],weights:[]}}
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&Array.isArray(o.logs)&&Array.isArray(o.weights))return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),tab="log",sel=T,confirmReset=false,liftSel="Leg press";
let P=[],DB=null,viewing=null,confirmPhoto=null;
let unit='kg';try{unit=localStorage.getItem('wb:unit')==='lb'?'lb':'kg'}catch(e){}
const toU=k=>unit==='lb'?k*2.20462:k,fromU=v=>unit==='lb'?v/2.20462:v,fw=k=>+toU(k).toFixed(unit==='lb'?1:2);
const idb=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('gymlog-photos',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
const st=m=>DB.transaction('p',m).objectStore('p');
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function initPhotos(){try{DB=await idb();const all=await req(st('readonly').getAll());P=[];for(const p of all){if(p.data)P.push({...p,url:p.data});else await req(st('readwrite').delete(p.id))}}catch(e){DB=null}render()}
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.75))};im.onerror=()=>rej();im.src=u})}
async function addPhoto(f){if(!f)return;if(!DB){toast('this browser cannot save photos');return}
try{const data=await shrink(f),el=$('#pdate'),date=(el&&el.value)||sel,a=$('#angle'),p={id:uid(),date,angle:a?a.value:'front',data};await req(st('readwrite').put(p));P.push({...p,url:data});sel=date;toast('photo saved to '+fmt(date))}catch(e){toast('could not save that photo')}render()}
async function delPhoto(id){const p=P.find(x=>x.id===id);try{await req(st('readwrite').delete(id))}catch(e){}if(p)URL.revokeObjectURL(p.url);P=P.filter(x=>x.id!==id)}

function vInsp(){const L=P.filter(p=>p.kind==='inspo').sort((a,b)=>a.date<b.date?1:-1);

function prs(){const m={};const B=S.base||{};for(const n in B)m[n]={w:B[n][0],r:B[n][1],d:null};
for(const l of S.logs){const p=m[l.ex];if(!p||l.w>p.w||(l.w===p.w&&l.r>p.r))m[l.ex]={w:l.w,r:l.r,d:l.date}}return m}
function last(ex){const ls=S.logs.filter(l=>l.ex===ex).sort((a,b)=>a.date<b.date?1:-1);if(!ls.length)return null;const d=ls[0].date;return ls.filter(l=>l.date===d).reduce((a,b)=>b.w>a.w||(b.w===a.w&&b.r>a.r)?b:a)}
function hint(ex){if(!ex)return"";const l=last(ex),p=prs()[ex];let h="";
if(l){const[lo,hi]=RANGE[ex]||[8,12];h=`Last: ${l.w} x ${l.r} x ${l.s} (${fmt(l.date)}). `+(l.r>=hi?`Top of the range hit, so add weight and restart near ${lo} reps.`:`Next: stay at ${l.w} and aim for ${l.r+1} reps.`)}
else h="New exercise: pick a weight you can do for 8-12 reps with 1-2 left in the tank.";
if(p)h+=` PR: ${p.w} x ${p.r}.`;return h}

function stats(){const ds=new Set(S.logs.map(l=>l.date));const ym=T.slice(0,7);const mo=[...ds].filter(d=>d.startsWith(ym)).length;

const ws=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);const kg=ws.length?fw(ws[ws.length-1].kg):"-";
return `<div><b>${mo}</b><span>gym days this month</span></div><div><b>${wk}</b><span>last 7 days</span></div><div><b>${kg}</b><span>${unit} now</span></div><div><b>${ds.size}</b><span>days logged</span></div>`}

function vCal(){const{y,m}=cal;const first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),days=new Set(S.logs.map(l=>l.date)),pd=new Set(P.filter(p=>!p.kind).map(p=>p.date));
let h=`<div class="calhead"><button data-a="prev" aria-label="Previous month">‹</button><b>${first.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</b><button data-a="next" aria-label="Next month">›</button></div><div class="cal">`+["M","T","W","T","F","S","S"].map(x=>`<i class="dow">${x}</i>`).join("");
for(let i=0;i<off;i++)h+="<i></i>";
for(let d=1;d<=n;d++){const s=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;h+=`<button class="d${days.has(s)?" on":""}${s===T?" today":""}${s===sel?" sel":""}${pd.has(s)?" ph":""}" data-day="${s}">${d}</button>`}
return h+`</div><p class="hint">Blue days have a logged session; an orange dot means a progress photo. Tap a day to see it, then use the Log tab to add lifts to that date.</p>`+dayList()}

function chart(series,x0,x1,y0,y1){const W=600,H=230,L=48,R=10,Tp=10,B=24;
const X=t=>L+(t-x0)/((x1-x0)||1)*(W-L-R),Y=v=>H-B-(v-y0)/((y1-y0)||1)*(H-Tp-B);let g="";
for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="tx">${+v.toFixed(1)}</text>`}
g+=`<text x="${L}" y="${H-6}" class="tx">${fmt(iso(new Date(x0)))}</text>`;
let c=new Date(x0);c=new Date(c.getFullYear(),c.getMonth()+1,1);
while(c.getTime()<x1){if(X(c.getTime())-L>48)g+=`<text x="${X(c.getTime())}" y="${H-6}" class="tx" text-anchor="middle">${c.toLocaleDateString("en-US",{month:"short"}).toLowerCase()}</text>`;c=new Date(c.getFullYear(),c.getMonth()+1,1)}
for(const s of series){g+=`<path d="${s.pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ")}" class="${s.c}"/>`;if(s.dots)s.pts.forEach(p=>g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4.5" class="dt"/>`)}
return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Chart">${g}</svg>`}

function wChart(){const ws=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);if(!ws.length)return`<p class="hint">Add a weigh-in to see the chart.</p>`;
const D=864e5,t0=dt(ws[0].date).getTime(),k0=toU(ws[0].kg),lt=dt(ws[ws.length-1].date).getTime();let x1=t0+183*D;if(lt>x1)x1=lt;
const mo=(x1-t0)/D/30.4,hi=k0+toU(0.6)*mo,lo=k0+toU(0.25)*mo,all=[...ws.map(w=>toU(w.kg)),lo,hi];
return chart([{pts:[[t0,k0],[x1,hi]],c:"pj"},{pts:[[t0,k0],[x1,lo]],c:"pj"},{pts:ws.map(w=>[dt(w.date).getTime(),toU(w.kg)]),c:"ln",dots:1}],t0,x1,Math.floor(Math.min(...all)-1),Math.ceil(Math.max(...all)+1))}

function lChart(){const m={};S.logs.filter(l=>l.ex===liftSel).forEach(l=>{m[l.date]=Math.max(m[l.date]||0,l.w)});const k=Object.keys(m).sort();
if(k.length<2)return`<p class="hint">Log this lift on two different days to see a trend.</p>`;
const pts=k.map(d=>[dt(d).getTime(),m[d]]),v=pts.map(p=>p[1]);
return chart([{pts,c:"ln",dots:1}],pts[0][0],pts[pts.length-1][0],Math.floor(Math.min(...v)-2),Math.ceil(Math.max(...v)+2))}

function vProg(){const p=prs(),cols=["var(--red)","var(--blue)","var(--yellow)","var(--green)","var(--white)"];

<ul class="list">${[...ws].reverse().slice(0,6).map(w=>`<li><span>${fmt(w.date)}: ${fw(w.kg)} ${unit}</span><button data-delw="${w.id}" aria-label="Delete">×</button></li>`).join("")}</ul>

function vPr(){const p=prs(),d1=new Date(),d2=new Date();d1.setDate(d1.getDate()-6);d2.setDate(d2.getDate()-30);const w=iso(d1),m=iso(d2);

function buildThemes(){$('#thpanel').innerHTML=`<div class='unit'><span>units</span><button data-unit='kg' class='${unit==='kg'?'cur':''}'>kg</button><button data-unit='lb' class='${unit==='lb'?'cur':''}'>lb</button></div>`+THEMES.map(t=>`<button class='th${t.n===curTheme?' cur':''}' data-th='${t.n}'><span class='chips'><i style='background:${t.bg}'></i><i style='background:${t.b}'></i><i style='background:${t.o}'></i></span>${t.n}<em>${t.g}</em></button>`).join('')}
try{applyTheme(localStorage.getItem('wb:theme'))}catch(e){applyTheme('')}
$('#thbtn').addEventListener('click',()=>{const p=$('#thpanel');p.hidden=!p.hidden;$('#thbtn').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)buildThemes()});
$('#thpanel').addEventListener('click',e=>{const u=e.target.closest('[data-unit]');if(u){unit=u.dataset.unit;try{localStorage.setItem('wb:unit',unit)}catch(x){}buildThemes();render();return}const b=e.target.closest('[data-th]');if(!b)return;applyTheme(b.dataset.th);$('#thpanel').hidden=true;$('#thbtn').setAttribute('aria-expanded','false')});
document.addEventListener('click',e=>{if(!e.target.closest('#thpanel,#thbtn')){$('#thpanel').hidden=true;$('#thbtn').setAttribute('aria-expanded','false')}});
let tapN=0,tapT;$('h1').addEventListener('click',()=>{tapN++;clearTimeout(tapT);tapT=setTimeout(()=>{tapN=0},900);if(tapN>=3){tapN=0;tab='insp';render()}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
